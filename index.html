<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de Inscripción</title>

    <style>
        body{
            background-color:#e3f2fd;
            font-family: Arial, sans-serif;
            margin:20px;
        }

        h1{
            text-align:center;
            color:#0d47a1;
        }

        p{
            color:#333;
        }

        form{
            background-color:white;
            padding:20px;
            border-radius:10px;
            width:80%;
            margin:auto;
            border:2px solid #90caf9;
        }

        fieldset{
            border:2px solid #64b5f6;
            margin-bottom:20px;
            padding:15px;
            background-color:#f5faff;
        }

        legend{
            color:#0d47a1;
            font-weight:bold;
            font-size:18px;
        }

        label{
            font-weight:bold;
            color:#1565c0;
        }

        input, select, textarea{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #90caf9;
            border-radius:5px;
        }

        input[type="radio"],
        input[type="checkbox"]{
            width:auto;
        }

        input[type="range"]{
            width:50%;
        }

        button{
            background-color:#1976d2;
            color:white;
            border:none;
            padding:10px 20px;
            margin:10px;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background-color:#0d47a1;
        }
    </style>

</head>

<body>

    <h1>Cuestionario de Inscripción al Taller de Desarrollo Web</h1>

    <p>
        Complete el siguiente formulario con su información personal y académica.
    </p>

    <form action="#" method="post">

        <!-- DATOS PERSONALES -->
        <fieldset>

            <legend>Datos Personales</legend>

            <label for="nombre">
                1. Nombres y apellidos:
            </label>

            <input 
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingrese su nombre completo"
                minlength="3"
                maxlength="80"
                required>

            <label for="correo">
                2. Correo electrónico:
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                required>

            <label for="telefono">
                3. Número de teléfono:
            </label>

            <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="0999999999"
                pattern="[0-9]{10}"
                required>

            <label for="edad">
                4. Edad:
            </label>

            <input
                type="number"
                id="edad"
                name="edad"
                min="15"
                max="80"
                required>

            <label for="fecha">
                5. Fecha de nacimiento:
            </label>

            <input
                type="date"
                id="fecha"
                name="fecha"
                required>

        </fieldset>

        <!-- DATOS ACADÉMICOS -->
        <fieldset>

            <legend>Datos Académicos</legend>

            <label for="carrera">
                6. Carrera o curso:
            </label>

            <input
                type="text"
                id="carrera"
                name="carrera"
                placeholder="Ejemplo: Ingeniería en Sistemas"
                required>

            <label for="nivel">
                7. Nivel académico:
            </label>

            <select id="nivel" name="nivel" required>

                <option value="">
                    Seleccione una opción
                </option>

                <option value="bachillerato">
                    Bachillerato
                </option>

                <option value="tecnologico">
                    Tecnológico
                </option>

                <option value="universitario">
                    Universitario
                </option>

                <option value="posgrado">
                    Posgrado
                </option>

            </select>

            <label for="institucion">
                8. Institución educativa:
            </label>

            <input
                type="text"
                id="institucion"
                name="institucion"
                placeholder="Nombre de la institución"
                required>

        </fieldset>

        <!-- PREFERENCIAS -->
        <fieldset>

            <legend>Preferencias del Taller</legend>

            <p><strong>9. Modalidad del taller:</strong></p>

            <input type="radio" id="presencial" name="modalidad" value="presencial" required>
            <label for="presencial">Presencial</label>

            <input type="radio" id="virtual" name="modalidad" value="virtual">
            <label for="virtual">Virtual</label>

            <input type="radio" id="hibrida" name="modalidad" value="hibrida">
            <label for="hibrida">Híbrida</label>

            <br><br>

            <p><strong>10. Temas de interés:</strong></p>

            <input type="checkbox" id="html" name="temas" value="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="temas" value="css">
            <label for="css">CSS</label>

            <input type="checkbox" id="javascript" name="temas" value="javascript">
            <label for="javascript">JavaScript</label>

            <input type="checkbox" id="bd" name="temas" value="bd">
            <label for="bd">Bases de Datos</label>

            <br><br>

            <label for="conocimiento">
                11. Nivel de conocimiento previo:
            </label>

            <select id="conocimiento" name="conocimiento">

                <option value="">
                    Seleccione una opción
                </option>

                <option value="basico">
                    Básico
                </option>

                <option value="intermedio">
                    Intermedio
                </option>

                <option value="avanzado">
                    Avanzado
                </option>

            </select>

            <label for="color">
                12. Color favorito:
            </label>

            <input
                type="color"
                id="color"
                name="color">

            <label for="motivacion">
                13. Nivel de motivación:
            </label>

            <input
                type="range"
                id="motivacion"
                name="motivacion"
                min="1"
                max="10">

        </fieldset>

        <!-- DISPONIBILIDAD -->
        <fieldset>

            <legend>Disponibilidad</legend>

            <label for="fecha_inicio">
                14. Fecha preferida para iniciar:
            </label>

            <input
                type="date"
                id="fecha_inicio"
                name="fecha_inicio">

            <label for="hora">
                15. Hora disponible:
            </label>

            <input
                type="time"
                id="hora"
                name="hora">

            <label for="jornada">
                16. Jornada preferida:
            </label>

            <select id="jornada" name="jornada">

                <option value="">
                    Seleccione una jornada
                </option>

                <option value="manana">
                    Mañana
                </option>

                <option value="tarde">
                    Tarde
                </option>

                <option value="noche">
                    Noche
                </option>

            </select>

        </fieldset>

        <!-- INFORMACIÓN ADICIONAL -->
        <fieldset>

            <legend>Información Adicional</legend>

            <label for="archivo">
                17. Subir archivo de ejemplo:
            </label>

            <input
                type="file"
                id="archivo"
                name="archivo">

            <label for="portafolio">
                18. Portafolio o perfil:
            </label>

            <input
                type="url"
                id="portafolio"
                name="portafolio"
                placeholder="https://ejemplo.com">

            <label for="comentarios">
                19. Comentarios adicionales:
            </label>

            <textarea
                id="comentarios"
                name="comentarios"
                rows="5"
                cols="40"
                maxlength="300"
                placeholder="Escriba aquí sus comentarios">
            </textarea>

        </fieldset>

        <center>
            <button type="submit">
                Enviar inscripción
            </button>

            <button type="reset">
                Limpiar formulario
            </button>
        </center>

    </form>

</body>
</html>
